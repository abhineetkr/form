<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Name Form</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        body { font-family: Arial, sans-serif; padding: 24px; }
        label { display: block; margin: 8px 0 4px; }
        input { padding: 8px; width: 280px; }
        button { margin-top: 16px; padding: 8px 16px; }
        #status { margin-top: 16px; color: green; font-weight: bold; }
    </style>
    <script>
        function onNext() {
            const first = document.getElementById('firstName').value;
            const last = document.getElementById('lastName').value;
            document.getElementById('status').textContent = `Next clicked with ${first} ${last}`;
        }
    </script>
    </head>
<body>
    <h1>Sample Name Form</h1>
    <label for="firstName">First name</label>
    <input type="text" id="firstName" placeholder="Enter first name" />

    <label for="lastName">Last name</label>
    <input type="text" id="lastName" placeholder="Enter last name" />

    <div>
        <button id="nextButton" onclick="onNext()">Next</button>
    </div>

    <div id="status"></div>
</body>
</html>
